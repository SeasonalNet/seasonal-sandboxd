name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: node24

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@11.17.0") {
            throw new Error(
              `expected packageManager pnpm@11.17.0, got ${pkg.packageManager}`
            );
          }

          if (pkg.scripts?.start !== "node dist/src/index.js") {
            throw new Error(
              `unexpected start script: ${pkg.scripts?.start}`
            );
          }

          console.log("package manager:", pkg.packageManager);
          console.log("start script:", pkg.scripts.start);
          NODE

          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency policy
        run: |
          pnpm ignored-builds
          pnpm peers check
          pnpm list --depth 0

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: |
          rm -rf dist
          pnpm build

          test -f dist/src/index.js
          test -f dist/src/cli.js
          test -f dist/src/db.js

          node --check dist/src/index.js
          node --check dist/src/cli.js
          node --check dist/src/db.js

      - name: Exercise Node SQLite fallback
        run: |
          node --input-type=module <<'NODE'
          import { DatabaseSync } from "node:sqlite";

          const database = new DatabaseSync(":memory:");

          database.exec(`
            CREATE TABLE smoke (
              id INTEGER PRIMARY KEY,
              value TEXT NOT NULL
            )
          `);

          database
            .prepare("INSERT INTO smoke (value) VALUES (?)")
            .run("seasonal-sandboxd");

          const row = database
            .prepare("SELECT id, value FROM smoke")
            .get();

          if (
            row?.id !== 1 ||
            row?.value !== "seasonal-sandboxd"
          ) {
            throw new Error(
              `unexpected SQLite result: ${JSON.stringify(row)}`
            );
          }

          database.close();
          console.log("node:sqlite smoke test: ok");
          NODE

      - name: Report optional SQLite backend
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";

          const require = createRequire(import.meta.url);

          try {
            const Database = require("better-sqlite3");
            const database = new Database(":memory:");

            database
              .prepare("SELECT 42 AS value")
              .get();

            database.close();
            console.log("optional better-sqlite3 backend: usable");
          } catch (error) {
            console.log(
              "optional better-sqlite3 backend unavailable; " +
              "Sandboxd will use node:sqlite"
            );
            console.log(String(error));
          }
          NODE
